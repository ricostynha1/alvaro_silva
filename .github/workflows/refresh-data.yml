name: Refresh site data

# Snapshots Google Scholar, GitHub and GitLab into data/*.json so the site
# stays fully static. Runs twice a month; trigger it by hand from the Actions tab.
on:
  schedule:
    - cron: "23 5 1,15 * *"   # 1st and 15th of each month, 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar, GitHub and GitLab data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_data.py

      - name: Commit if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Scholar, GitHub and GitLab data"
          git pull --rebase
          git push
